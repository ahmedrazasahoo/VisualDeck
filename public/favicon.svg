<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Back card (slightly rotated) -->
  <rect x="12" y="14" width="30" height="38" rx="4" fill="rgba(255,255,255,0.25)" transform="rotate(-8 27 33)"/>
  <!-- Middle card -->
  <rect x="16" y="13" width="30" height="38" rx="4" fill="rgba(255,255,255,0.45)" transform="rotate(-2 31 32)"/>
  <!-- Front card -->
  <rect x="20" y="12" width="30" height="38" rx="4" fill="white"/>
  <!-- Card lines decoration -->
  <rect x="25" y="20" width="18" height="3" rx="1.5" fill="#667eea" opacity="0.7"/>
  <rect x="25" y="27" width="14" height="2" rx="1" fill="#764ba2" opacity="0.5"/>
  <rect x="25" y="33" width="16" height="2" rx="1" fill="#764ba2" opacity="0.5"/>
  <rect x="25" y="39" width="10" height="2" rx="1" fill="#764ba2" opacity="0.3"/>
</svg>
